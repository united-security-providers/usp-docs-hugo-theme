{{- /* Hugo's built-in alias template resolves against baseURL, which the theme
       deliberately leaves bare so a site works under any path prefix. Relative,
       like every other link the site emits. */ -}}
<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>{{ .Page.Title }}</title>
    <link rel="canonical" href="{{ .Page.RelPermalink }}">
    <meta http-equiv="refresh" content="0; url={{ .Page.RelPermalink }}">
  </head>
  <body>
    <p><a href="{{ .Page.RelPermalink }}">Continue to {{ .Page.LinkTitle }}</a>.</p>
  </body>
</html>

theme: usp-docs
title: 'Example Product C documentation'
copyright: '&copy; 2026 Example AG. All Rights Reserved.'

baseURL: 'https://docs.example.com/product-c/'

disableKinds: ['taxonomy', 'term', 'rss']

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    contentDir: content/en

markup:
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: ['html', 'llms', 'markdown']
  section: ['html', 'markdown']
  page: ['html', 'markdown']

params:
  description: 'Documentation of the example Product C'
  logo: images/USP-Logo-2023-ohne-claim-lang-white1.webp
  # Wider than the  theme default, for the wide tables.
  contentMaxWidth: 50rem
  eol: ['0.9.x']
  search:
    enabled: true
  social:
    - icon: linkedin
      link: https://www.linkedin.com/company/example/
      name: Example on Linkedin

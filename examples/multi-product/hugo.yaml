theme: usp-docs
title: 'Example documentation'
copyright: '&copy; 2026 Example AG. All Rights Reserved.'

baseURL: 'https://docs.example.com/'
relativeURLs: true

disableKinds: ['taxonomy', 'term', 'rss']

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    contentDir: content/en

markup:
  goldmark:
    renderer:
      unsafe: true
  # This example is the one that switches the syntax highlighting off again.
  highlight:
    codeFences: false

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: ['html', 'llms', 'markdown']
  section: ['html', 'markdown']
  page: ['html', 'markdown']

params:
  canonicalBase: 'https://docs.example.com/'
  description: 'Documentation of the example products'
  logo: images/USP-Logo-2023-ohne-claim-lang-white1.webp
  eol: ['product-a/0.5.x']
  search:
    enabled: true
  social:
    - icon: linkedin
      link: https://www.linkedin.com/company/example/
      name: Example on Linkedin
